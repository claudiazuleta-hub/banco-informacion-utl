function ficha(e){let rs=e.rs,r=rs[0];$('detail').innerHTML=`<h3>${esc(e.title)}</h3><p class="muted">${esc(names[e.type])} · ${esc(r[6])}</p>${graph(rs)}<div class="scroll"><table><thead><tr><th>Variable</th><th>Año / corte</th><th>Territorio</th><th>Valor</th></tr></thead><tbody>${rs.map(x=>'<tr>'+[x[18]||x[2],[x[3],x[4]].filter(Boolean).join(' · '),[x[7],x[8],x[10]].filter(Boolean).join(' · '),fmt(x[5])].map(y=>'<td>'+esc(y)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>${rs.map(x=>`<details><summary>${esc(x[2])} · ${esc(x[3])}</summary><p>${esc(x[14])}</p><p>Fuente: ${esc(x[11])} · ${esc(x[13])}</p><p>Estado: ${esc(x[16])}</p></details>`).join('')}<div class="actions"><button id="dx">Excel de la ficha</button><button id="dc">CSV de la ficha</button></div>`;$('dx').onclick=()=>withRows(rs,excel);$('dc').onclick=()=>withRows(rs,csv);if(innerWidth<850)$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function withRows(rs,fn){let old=filtered;filtered=rs;try{fn()}finally{filtered=old}}
function csv(){let h=['Área','Subtema','Indicador','Año','Corte','Valor','Unidad','Nivel','Departamento','DANE','Municipio','Entidad','Tipo','Ubicación','Interpretación','Verificación','Estado','Indicador agrupado','Serie'];let text=[h,...filtered].map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.download='indicadores-utl.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=Number(b.dataset.tab);refresh()}};$('results').onclick=e=>{let b=e.target.closest('[data-i]');if(b)ficha(shown[Number(b.dataset.i)])};fields.forEach(([id])=>$(id).onchange=refresh);$('q').oninput=refresh;$('reset').onclick=()=>{fields.forEach(([id])=>$(id).value='');$('q').value='';refresh()};$('prev').onclick=()=>{pg--;render()};$('next').onclick=()=>{pg++;render()};$('excel').onclick=excel;$('csv').onclick=csv;refresh();
</script></body></html>
